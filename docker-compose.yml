# Producción (DESIGN.md §4, SECURITY.md §6). Ningún servicio publica puertos:
# la única entrada es el túnel saliente de Cloudflare hacia la app (sin proxy intermedio, ADR-0011).
# Imágenes fijadas por digest (auditoría H-16, 07-10-2026): se renuevan en el ciclo mensual (RUNBOOK §5).
name: neltume

services:
  db:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      TZ: America/Santiago
    volumes:
      - pg_data:/var/lib/postgresql
    networks: [datos]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 6

  migrar:
    build: { context: ., target: migrar }
    environment:
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/postgres
      DATABASE_URL_OWNER: ${DATABASE_URL_OWNER}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER}
      DATABASE_URL_COMPRAS: ${DATABASE_URL_COMPRAS:-}
    networks: [datos]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: app }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL}
      APP_TZ: America/Santiago
      LLM_TOPE_DIARIO_USD: ${LLM_TOPE_DIARIO_USD}
      LLM_PRESUPUESTO_MENSUAL_USD: ${LLM_PRESUPUESTO_MENSUAL_USD}
      # Datos de la empresa impresos en los PDF (src/lib/marca.ts); vacíos no se imprimen.
      NELTUME_EMPRESA_NOMBRE: ${NELTUME_EMPRESA_NOMBRE:-}
      NELTUME_EMPRESA_RUT: ${NELTUME_EMPRESA_RUT:-}
      NELTUME_EMPRESA_DIRECCION: ${NELTUME_EMPRESA_DIRECCION:-}
      NELTUME_EMPRESA_TELEFONO: ${NELTUME_EMPRESA_TELEFONO:-}
      NELTUME_EMPRESA_WEB: ${NELTUME_EMPRESA_WEB:-}
      NELTUME_EMPRESA_CORREO: ${NELTUME_EMPRESA_CORREO:-}
    networks: [backend, datos]
    depends_on:
      migrar: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      retries: 3

  # Se habilita con el cotizador (TASKS T1.26): `docker compose --profile ia up -d`.
  worker:
    profiles: [ia]
    build: { context: ., target: worker }
    restart: unless-stopped
    environment:
      # Rol de BD propio con permisos mínimos (ADR-0017): no ve usuarios, clientes, stock ni costos.
      DATABASE_URL: ${DATABASE_URL_WORKER}
      CMD_API_KEY: ${CMD_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CMD_API_BASE_URL: ${CMD_API_BASE_URL}
      GROQ_API_BASE_URL: ${GROQ_API_BASE_URL}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS}
      LLM_MAX_REINTENTOS: ${LLM_MAX_REINTENTOS}
      LLM_TOPE_DIARIO_USD: ${LLM_TOPE_DIARIO_USD}
      LLM_TOPE_DIARIO_LLAMADAS: ${LLM_TOPE_DIARIO_LLAMADAS:-}
      IA_TRABAJO_COLGADO_S: ${IA_TRABAJO_COLGADO_S:-}
      LLM_PRESUPUESTO_MENSUAL_USD: ${LLM_PRESUPUESTO_MENSUAL_USD}
    networks: [datos, salida]
    depends_on:
      migrar: { condition: service_completed_successfully }

  # Compras desde Chipax (ADR-0021): `COMPOSE_PROFILES=ia,chipax`. Solo este servicio recibe las credenciales de Chipax.
  compras:
    profiles: [chipax]
    build: { context: ., target: compras }
    restart: unless-stopped
    environment:
      # Rol de BD propio: solo inserta recepciones de materias primas, compras y sus líneas.
      DATABASE_URL_COMPRAS: ${DATABASE_URL_COMPRAS:-}
      CHIPAX_APP_ID: ${CHIPAX_APP_ID:-}
      CHIPAX_SECRET_KEY: ${CHIPAX_SECRET_KEY:-}
    networks: [datos, salida]
    depends_on:
      migrar: { condition: service_completed_successfully }

  tunnel:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    # `borde` para salir a Cloudflare; `backend` (interna) para llegar solo a la app.
    networks: [borde, backend]
    depends_on: [app]

  backup:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: neltume
      BACKUP_RETENCION_DIAS: ${BACKUP_RETENCION_DIAS}
      TZ: America/Santiago
    volumes:
      - backups:/backups
      # Copia externa (DESIGN §6): ruta del host en otro disco, NAS o carpeta sincronizada fuera del servidor.
      - ${BACKUP_DESTINO_EXTERNO:-./respaldos-externos}:/externo
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/restaurar-prueba.sh:/restaurar-prueba.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    # «unhealthy» si no hubo un respaldo verificado en 26 h (auditoría H-01); `docker compose ps` lo muestra.
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /backups/ultimo-ok -mmin -1560 2>/dev/null)\""]
      interval: 30m
      start_period: 26h
    networks: [datos]
    depends_on:
      db: { condition: service_healthy }

networks:
  borde: {}
  salida: {}
  backend: { internal: true }
  datos: { internal: true }

volumes:
  pg_data: {}
  backups: {}
